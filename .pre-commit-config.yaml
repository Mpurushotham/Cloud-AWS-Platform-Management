repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.1
    hooks:
      - id: terraform_fmt
      # checkov, tfsec and tflint are intentionally not run here: the hooks
      # shell out to binaries the CI runner does not install, and each already
      # has a dedicated job in 01-iac-security.yml. Running them twice meant
      # one copy failing with 'command not found' while the real job passed.
      - id: terraform_validate
        # environments/ pass arguments the stub modules never declare, and
        # bootstrap/ is superseded by terraform/lab/02-bootstrap. Both are
        # tracked in docs/security/known-issues.md; excluded here so the hook
        # reports on code that can actually be validated.
        exclude: ^terraform/(environments|bootstrap)/
        args:
          - --init-args=-backend=false
      - id: terraform_docs
        args:
          - --args=--output-mode inject

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
