---
extends: default

rules:
  line-length:
    max: 120
    level: warning

  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: true

  comments:
    min-spaces-from-content: 1

  # "---" is conventional in Kubernetes manifests and GitHub workflows, and is
  # required for multi-document files. Presence is fine; absence is fine too.
  document-start: disable

  brackets:
    max-spaces-inside: 1

  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

ignore: |
  # Helm templates are Go templates, not YAML: "{{ .Values.x }}" is reported as
  # "too many spaces inside braces" and the file cannot be parsed as a document.
  # `helm lint` is the correct tool and runs in the Kubernetes pipeline.
  kubernetes/helm-charts/*/templates/
  cdk/node_modules/
  .terraform/
  cdk/cdk.out/
