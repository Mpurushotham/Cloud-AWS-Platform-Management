# Dependabot configuration.
#
# The previous file was the unedited GitHub template: package-ecosystem was ""
# and directory pointed at "/dependabot/", so nothing was ever updated.
#
# cooldown delays adoption of a brand-new release. A compromised publish is most
# dangerous in its first days, before anyone has looked at it; waiting gives the
# ecosystem time to notice before the version lands in a pull request here.

version: 2

updates:
  # GitHub Actions. Every action in this repository is pinned to a commit SHA
  # with the version in a trailing comment; Dependabot understands that form and
  # bumps both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # CDK application layer.
  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "cdk"
    groups:
      # Test tooling churns constantly and is never shipped; one PR is enough.
      dev-dependencies:
        dependency-type: "development"

  # Terraform providers.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/lab/00-identity"
      - "/terraform/lab/01-governance"
      - "/terraform/lab/02-bootstrap"
      - "/terraform/lab/03-network"
      - "/terraform/lab/04-workload"
      - "/terraform/modules/*"
      - "/terraform/environments/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "terraform"
    groups:
      # One provider version is a single decision, not 44. Without grouping,
      # every module directory raises its own PR for the same bump -- which is
      # exactly what happened when versions.tf was added across 32 modules.
      aws-provider:
        patterns:
          - "hashicorp/aws"
    ignore:
      # The AWS provider 5 -> 6 upgrade is a breaking change, not a routine
      # bump: provider 6 renames data.aws_region.<x>.name to .region, which
      # this repository uses in modules/security-hub and modules/vpc, and
      # CLAUDE.md pins ~> 5.0 as a documented convention.
      #
      # It belongs in one deliberate change with an ADR, not an automated PR.
      # Remove this entry when that work is scheduled.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]

  # Python used by the remediation lambdas and helper scripts.
  - package-ecosystem: "pip"
    directories:
      - "/security/remediation-lambdas/*"
      - "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
