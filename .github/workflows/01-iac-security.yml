name: "01 - IaC Security"

on:
  pull_request:
    paths:
      - "terraform/**"
      - "cdk/**"
      - "conftest.rego"
      - ".checkov.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  checkov:
    name: "Checkov IaC Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.3113.0
        with:
          directory: terraform/
          config_file: .checkov.yml
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          download_external_modules: false

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  tfsec:
    name: "tfsec Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: sarif
          sarif_file: tfsec-results.sarif
          additional_args: --exclude-downloaded-modules --minimum-severity HIGH

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  tflint:
    name: "TFLint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: Init TFLint
        run: tflint --init --config=.tflint.hcl

      # Fails on errors; warnings are reported but do not block.
      #
      # Most modules under terraform/modules are unimplemented placeholders that
      # declare an interface ahead of the resources that will use it, which
      # trips terraform_unused_declarations legitimately. Deleting those
      # declarations to satisfy the linter would remove the documented interface
      # and break the environment stacks that already pass those arguments.
      #
      # The real defect underneath -- environments passing arguments the stub
      # modules never declare -- is tracked in docs/security/known-issues.md and
      # is not something a linter severity setting should paper over.
      - name: Run TFLint across all modules
        run: |
          set -o pipefail
          rc=0
          find terraform/modules terraform/lab -name "*.tf" -print0 \
            | xargs -0 -I{} dirname {} \
            | sort -u \
            | while IFS= read -r dir; do
                echo "::group::$dir"
                tflint --config="$(pwd)/.tflint.hcl" --chdir="$dir" \
                  --minimum-failure-severity=error || rc=1
                echo "::endgroup::"
              done
          exit $rc

  infracost:
    name: "Infracost Cost Estimate"
    runs-on: ubuntu-24.04
    # Requires an API key. Skipped rather than failed when the secret is absent,
    # so a fork or a fresh clone does not show a permanently red check for a
    # credential it cannot have.
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON
        run: |
          infracost breakdown \
            --path terraform/environments/prod \
            --format json \
            --out-file infracost.json

      # infracost/actions/comment@v3 does not exist -- the action repository has
      # no action.yml at that path, so the job failed with "Can't find
      # 'action.yml'". The CLI subcommand is the supported route.
      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --behavior update

  opa-validate:
    name: "OPA Policy Validation"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA + conftest
        run: |
          wget -q -O /tmp/conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Validate OPA policy syntax
        run: conftest verify --policy conftest.rego

      - name: Test OPA policies with fixtures
        run: |
          if [ -d test-fixtures ]; then
            conftest test test-fixtures/ --policy conftest.rego
          else
            echo "No test fixtures found — skipping OPA fixture tests"
          fi
