name: "03 - SCA & SBOM"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

jobs:
  trivy-filesystem:
    name: "Trivy Filesystem Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          # Secrets are already covered by gitleaks, detect-secrets and
          # GitGuardian; a fourth scanner adds runtime and duplicate findings.
          scanners: vuln
          # Provider binaries and vendored packages are not what we ship.
          skip-dirs: '**/.terraform,**/node_modules,**/cdk.out'
          trivyignores: .trivyignore
          # Report into GitHub code scanning rather than gating the build.
          # Grype already fails on critical; two tools gating the same finding
          # produces two red checks for one problem and teaches people to ignore
          # both. Findings remain visible in the Security tab.
          ignore-unfixed: true
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  grype:
    name: "Grype Vulnerability Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHSA-mh99-v99m-4gvg (brace-expansion <=5.0.7) is unresolvable here: the
      # vulnerable copy is inside aws-cdk-lib's bundled dependencies, which npm
      # overrides cannot reach, and aws-cdk-lib is already on its latest release.
      # Direct dependencies are pinned past it via an override in cdk/package.json.
      # Recorded in docs/security/known-issues.md.
      # Driven through the CLI rather than anchore/scan-action so that
      # .grype.yaml is honoured. The action does not read it, and without the
      # exclusions there it reports hundreds of findings from .terraform/
      # provider binaries -- Go advisories belonging to HashiCorp's release that
      # are neither shipped nor fixable here.
      - name: Install Grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype_install

      # The DB bundled with the installed grype is far older than the 5-day
      # maximum age grype enforces, so a scan without this fails with
      # "db could not be loaded" rather than reporting anything.
      # scan-action v4 installed grype 0.80.0, whose DB schema Anchore no longer
      # publishes -- `db update` succeeded while leaving a 20-week-old database,
      # and the scan then aborted with "db could not be loaded" rather than
      # reporting anything. v7 installs a current grype.
      #
      # db update and the scan share a cache directory, so they run in one step.
      - name: Scan with Grype
        id: grype
        env:
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          GRYPE="${{ steps.grype_install.outputs.cmd }}"
          "$GRYPE" db update
          "$GRYPE" dir:. \
            --config .grype.yaml \
            --fail-on critical \
            --output sarif \
            --file results.sarif

      - name: Check for SARIF output
        id: grype_sarif
        if: always()
        run: |
          if [ -s results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Grype produced no usable SARIF; skipping upload"
          fi

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always() && steps.grype_sarif.outputs.exists == 'true'
        with:
          sarif_file: results.sarif
          category: grype

  sbom:
    name: "SBOM Generation"
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned action instead of piping a remote install script from the
      # syft main branch into a shell -- that content can change at any
      # time and is executed with the runner's full privileges.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9

      - name: Generate SBOM for CDK node modules
        run: |
          cd cdk && npm ci --ignore-scripts
          syft dir:. \
            --output spdx-json=../sbom-cdk.spdx.json \
            --output cyclonedx-json=../sbom-cdk-cyclonedx.json

      - name: Generate SBOM for Python Lambdas
        run: |
          syft dir:security/remediation-lambdas \
            --output spdx-json=sbom-lambdas.spdx.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-*.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: sbom-*.json
