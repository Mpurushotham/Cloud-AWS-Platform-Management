name: "04 - Container Security"

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/docker-compose*.yml"
  pull_request:
    paths:
      - "**/Dockerfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

jobs:
  hadolint:
    name: "Dockerfile Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "**/Dockerfile"
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif
          ignore: DL3008,DL3009,DL3018

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  build-scan-push:
    name: "Build, Scan & Push — ${{ matrix.image }}"
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - image: api-service
            dockerfile: ecs/task-definitions/api.Dockerfile
          - image: worker
            dockerfile: ecs/task-definitions/worker.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.IMAGE_PUSH_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-ImagePush-${{ github.run_id }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build image
        id: build
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/cap-shared-${{ matrix.image }}:${IMAGE_TAG}
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ${IMAGE_URI} \
            -f ${{ matrix.dockerfile }} .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image_uri }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image-${{ matrix.image }}

      # Pinned action instead of piping a remote install script into a shell.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9

      - name: Generate SBOM for image
        run: |
          syft ${{ steps.build.outputs.image_uri }} \
            --output spdx-json=sbom-image-${{ matrix.image }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Push image
        run: docker push ${{ steps.build.outputs.image_uri }}

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes ${{ steps.build.outputs.image_uri }}

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom-image-${{ matrix.image }}.spdx.json \
            --type spdxjson \
            ${{ steps.build.outputs.image_uri }}
