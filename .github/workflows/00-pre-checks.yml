name: "00 - Pre-Checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: "Secrets Detection"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Allowlists reviewed false positives -- see .gitleaks.toml for why
          # each entry is there.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      # On a push to main, base and head resolve to the same commit and
      # TruffleHog exits with "BASE and HEAD commits are the same". The diff
      # scan is only meaningful on a pull request; gitleaks below scans the full
      # history on every run regardless.
      - name: TruffleHog scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@bc2cd3e45e3aa4a6c627bd0c424580f86dde1855 # v3.90.10
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

  commitlint:
    name: "Commit Message Lint"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  terraform-fmt:
    name: "Terraform Format & Parse"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # This is a parse check as much as a formatting one: terraform fmt reads
      # every .tf file, so malformed HCL fails here rather than at plan time in
      # whichever directory happens to be applied first. 51 files in this
      # repository were unparseable before this gate existed.
      - name: Check formatting and parseability
        run: terraform fmt -check -recursive -diff terraform/

  file-checks:
    name: "File Quality Checks"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
        env:
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
          # no-commit-to-branch guards a developer's working copy. In CI the
          # checkout *is* main, so the hook fails on every push by definition and
          # tells nobody anything. `stages: [pre-commit]` does not help --
          # `pre-commit run --all-files` runs that stage. Branch protection is
          # what actually enforces this.
          SKIP: no-commit-to-branch

      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml .github/workflows/

  dependency-review:
    name: "Dependency Review"
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: critical
          # brace-expansion reaches the tree only through jest/ts-jest, which are
          # devDependencies that never ship, and the remaining copy is bundled
          # inside aws-cdk-lib where an override cannot reach it. Allowed
          # explicitly rather than by lowering the bar for everything.
          allow-ghsas: GHSA-mh99-v99m-4gvg
          # Scorecard scores are a signal, not a defect; they should not gate a merge.
          warn-only: false
